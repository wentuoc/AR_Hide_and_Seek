<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meccha · Glove calibration</title>
<style>body{font:17px system-ui;background:#eef3f1;color:#183b31;max-width:850px;margin:50px auto;padding:20px}section{background:white;border-radius:18px;padding:28px;margin:18px 0}button,select{font:inherit;padding:12px;border-radius:9px;border:1px solid #aac1b6}button{background:#14644b;color:white;margin:8px 12px 8px 0;cursor:pointer}button:disabled{opacity:.4;cursor:default}pre{white-space:pre-wrap;font-size:14px}small{color:#4c695f}</style>
<h1>Meccha · Wireless calibration</h1><small>Glove → Laptop relay → Ultra96 · No AR</small><section>
<label>Glove <select id="device"><option value="1">Device 1</option><option value="2">Device 2</option></select></label>
<h2 id="state">Connecting…</h2><p id="hint"></p><button id="flex" disabled>1. Calibrate flex</button><button id="gyro" disabled>2. Calibrate gyro</button><p id="message"></p>
</section><section><h2>Live sensor values</h2><pre id="values">Waiting for calibration</pre><p id="ai"></p></section>
<script>
const el=id=>document.getElementById(id);let busy=false;
const hints={WAIT_FLEX:'Click Calibrate flex. After a 3-second countdown, fully open and bend every finger for 5 seconds.',FLEX_COUNTDOWN:'Get ready. Movement starts after the countdown.',FLEX_RUNNING:'Fully open and bend ALL five fingers repeatedly.',WAIT_GYRO:'Keep the glove still, then click Calibrate gyro.',GYRO_RUNNING:'Keep the glove completely still until READY.',READY:'Calibration complete. Live sampling is active.',SENSOR_ERROR:'Sensor initialization failed. Check wiring and restart the glove.'};
async function refresh(){try{let r=await fetch('/status');let s=await r.json();if(!r.ok)throw Error(s.error);let d=el('device').value;let online=s.devices[d]?.online;let state=online?s.calibration[d]:'OFFLINE';el('state').textContent=state||'Waiting for status';el('hint').textContent=hints[state]||'Check glove power, Wi-Fi, relay and SSH connection.';el('flex').disabled=busy||!online||!['WAIT_FLEX','WAIT_GYRO','READY'].includes(state);el('gyro').disabled=busy||!online||!['WAIT_GYRO','READY'].includes(state);let sample=s.latest_samples[d];el('values').textContent=sample?JSON.stringify({imu:sample.imu,flex:sample.flex,sample_seq:sample.sample_seq},null,2):'Waiting for calibrated samples';el('ai').textContent=s.ai_fault?'AI stopped: '+s.ai_fault:s.capture_only?'Capture only · AI disabled':'Inference count: '+s.inferences[d]+' · Class: '+(s.latest_class_ids[d]??'waiting');}catch(e){el('state').textContent='Connection unavailable';el('hint').textContent=e.message;el('flex').disabled=el('gyro').disabled=true;el('values').textContent='Unavailable';el('ai').textContent='';}}
async function calibrate(action){busy=true;el('flex').disabled=el('gyro').disabled=true;try{let r=await fetch('/calibrate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({device_id:Number(el('device').value),action})});let s=await r.json();el('message').textContent=s.accepted?'Command accepted. Follow the instructions above.':s.error||'Command rejected. Check the current state.';}catch(e){el('message').textContent='Connection lost. Check status before trying again.';}finally{busy=false;refresh();}}
el('flex').onclick=()=>calibrate('c');el('gyro').onclick=()=>calibrate('g');el('device').onchange=refresh;refresh();setInterval(refresh,1000);
</script></html>
